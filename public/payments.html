<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment History · PRMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar"></header>
<div class="shell">
  <nav id="sidebar" class="sidebar"></nav>
  <main class="content">
    <div class="page-head">
      <div>
        <h1 class="page-title">Payment History</h1>
        <p class="subtitle">All rent and deposit payments you have made.</p>
      </div>
      <a class="btn" href="pay.html">Make a payment</a>
    </div>

    <div id="alert"></div>
    <div class="stats" id="summary"></div>
    <!-- Task 59: tenant's payment history page -->
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Reference</th><th>Property / Unit</th><th>Type</th><th>Card</th><th class="num">Amount</th><th>Status</th></tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/common.js"></script>
<script>
  (async () => {
    await initPage();
    try {
      const { payments } = await api('GET', '/api/payments/mine');
      const sum = (type) => payments.filter((p) => !type || p.type === type).reduce((s, p) => s + p.amount, 0);
      document.getElementById('summary').innerHTML = [
        ['Total paid', money(sum())], ['Rent paid', money(sum('Rent'))], ['Deposits paid', money(sum('Deposit'))], ['Payments', payments.length],
      ].map(([label, value]) => `<div class="stat"><div class="value">${value}</div><div class="label">${label}</div></div>`).join('');

      document.getElementById('rows').innerHTML = payments.length ? payments.map((p) => `<tr>
        <td>${fmtDate(p.paid_at)}</td>
        <td><code>${esc(p.reference)}</code></td>
        <td>${esc(p.address)} <span class="muted small">· Unit ${esc(p.unit_number)}</span></td>
        <td>${badge(p.type)}</td>
        <td>•••• ${esc(p.card_last4)}</td>
        <td class="num">${money(p.amount)}</td>
        <td>${badge(p.status)}</td>
      </tr>`).join('') : emptyRow(7, 'No payments yet.');
    } catch (err) { showAlert('alert', err.message); }
  })();
</script>
</body>
</html>
